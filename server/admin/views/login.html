<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin Login | KEEN Audio</title>
  <link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <a class="brand" href="/">KEEN <span>AUDIO</span></a>
    <p class="eyebrow">BUSINESS MANAGEMENT</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage your business.</p>
    <form id="login-form" novalidate>
      <label>Email<input name="email" type="email" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p id="form-message" class="form-message" role="alert"></p>
      <button type="submit">Sign in securely</button>
    </form>
    <a class="back-link" href="/">← Back to KEEN Audio</a>
  </main>
  <script src="/admin/assets/login.js" defer></script>
</body>
</html>
